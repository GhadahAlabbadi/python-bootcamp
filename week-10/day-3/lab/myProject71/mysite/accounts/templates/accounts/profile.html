{% extends 'accounts/base.html' %}
{% load static %}
{% block title %}Profile{% endblock %}
{% block content %}
<h2>Profile</h2>

{% if avatar_url %}
    <img src="{{ avatar_url }}" alt="{{ username }}'s avatar" class="avatar">
{% else %}
        <img src="{% static 'images/default-avatar.png' %}" alt="Default avatar" class="avatar">
{% endif %}

<p>Logged in as: <strong>{{ username }}</strong></p>
<p><a href="{% url 'accounts:upload_avatar' %}">Upload / change profile picture</a></p>
{% endblock %}
