{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    {% block extra_head %}
    {% endblock %}
    <title>{% block title %}My Site{% endblock %}</title>
</head>
<body>
        <nav class="navbar">
        <span class="navbar-brand">Ghadah Google</span>
        <div class="navbar-links">
            <a href="{% url 'pages:home' %}">Home</a>
            <a href="{% url 'pages:about' %}">About</a>
            <a href="{% url 'pages:projects' %}">Projects</a>
            <a href="{% url 'courses:list' %}">Courses</a>
            <a href="{% url 'products:list' %}">Products</a>
            <a href="{% url 'posts:feed' %}">Posts</a>
            <a href="{% url 'accounts:register' %}">Register</a>
            <a href="{% url 'accounts:login' %}">Login</a>
            <a href="{% url 'accounts:profile' %}">Profile</a>
        </div>
    </nav>

    <main class="content">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 My Django Site</p>
    </footer>
</body>
</html>
