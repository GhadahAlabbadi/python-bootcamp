<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Books</title>
</head>
<body>
    {% extends 'library/base.html' %}
    {% block content %}
    <h2>Books</h2>
    <ul>
        {% for book in books %}
            <li>{{ book.title }} by {{ book.author }}</li>
                <a href="{% url 'library:book_detail' book.id %}">{{book.title}}</a>
                {{book.author}}
            </li>
        {% endfor %}
    </ul>
    {% endblock %}
</body>
</html>
