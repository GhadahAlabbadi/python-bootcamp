{% extends 'blog/base.html' %}
{% block title %}All Posts{% endblock %}
{% block content %}
<h2>All Posts</h2>
<ul>
    {% for post in posts %}
        <li>
            <a href="{% url 'blog:post_detail' post.id %}">{{ post.title }}</a>
            — <a href="{% url 'blog:post_category' post.category %}">{{ post.category }}</a>
        </li>
    {% endfor %}
</ul>
{% endblock %}
