{% extends 'movies/base.html' %}
{% block content %}
<h2>All Movies</h2>
    <ul>
        {% for movie in movies %}
            <li>
                <a href="{% url 'movies:movie_detail' movie.id %}">{{ movie.title }}</a>
                ({{ movie.year }}) - Rating: {{ movie.rating }}
            </li>
        {% endfor %}
    </ul>
{% endblock %}
